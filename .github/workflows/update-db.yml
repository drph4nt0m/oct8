name: Update IP Databases

on:
  schedule:
    # Run daily at 00:00 UTC (Ensures fresh reputation and identity data)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-db
  cancel-in-progress: false

jobs:
  update-db:
    runs-on: ubuntu-latest
    name: Download, Build, and Upload DBs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate WHOIS Data
        run: npx tsx scripts/fetch-delegations.ts

      - name: Download Databases and Build Binary
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: npm run update-db

      - name: Upload to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          upload_r2() {
            local key="$1"
            local file="$2"
            local attempt
            for attempt in 1 2 3; do
              echo "Uploading ${key} (attempt ${attempt}/3)..."
              if npx wrangler r2 object put "oct8-data/${key}" --file "${file}" --remote; then
                return 0
              fi
              if [ "${attempt}" -lt 3 ]; then
                echo "Upload failed for ${key}; retrying in $((attempt * 5))s..."
                sleep $((attempt * 5))
              fi
            done
            echo "Upload failed for ${key} after 3 attempts" >&2
            return 1
          }

          upload_r2 "insight.bin" "data/insight.bin"
          upload_r2 "GeoLite2-City.mmdb" "data/GeoLite2-City.mmdb"
          upload_r2 "GeoLite2-ASN.mmdb" "data/GeoLite2-ASN.mmdb"
          upload_r2 "reputation.json" "data/reputation.json"
          upload_r2 "whois.json" "data/whois.json"
          upload_r2 "cloud.json" "data/cloud.json"
